---
name: Codescythe Crate Release
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (verify existing tag artifacts only, no publish)
        type: boolean
        required: false
        default: true
concurrency:
  group: "${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}"
  cancel-in-progress: false
jobs:
  gate:
    name: Verify release commit
    if: "${{ startsWith(github.event.release.tag_name || github.ref_name, 'codescythe_cli_v')
      }}"
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
    - env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_TAG: "${{ github.event.release.tag_name || github.ref_name }}"
      run: python3 .github/scripts/gha-release-gate.py
  verify:
    name: Verify crate package
    if: "${{ startsWith(github.event.release.tag_name || github.ref_name, 'codescythe_cli_v')
      }}"
    timeout-minutes: 100
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
      with:
        bazelisk-cache: true
        disk-cache: crate-package
        repository-cache: true
    - name: Build and verify crate
      run: |-
        bazel test //crates/codescythe:codescythe_schema_test //crates/codescythe:codescythe_test
        rustup toolchain install 1.93.0 --profile minimal
        rustup run 1.93.0 cargo package -p codescythe --locked
        mkdir -p release
        cp target/package/codescythe-*.crate release/
    - name: Setup Rust
      run: rustup toolchain install 1.93.0 --profile minimal
    - name: Compare package inputs without compiling
      run: |
        set -euo pipefail
        rustup run 1.93.0 cargo package -p codescythe --locked --no-verify
        version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/codescythe/Cargo.toml)
        python3 .github/scripts/verify-crate.py \
          "release/codescythe-$version.crate" "target/package/codescythe-$version.crate"
    - name: Upload verified crate
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: verified-crate
        path: release/*.crate
        retention-days: 7
    needs: gate
  publish:
    name: Publish crate
    needs:
    - verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    if: "${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name,
      'codescythe_cli_v')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run
      == false && startsWith(github.ref_name, 'codescythe_cli_v')) }}"
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Setup Rust
      run: rustup toolchain install 1.93.0 --profile minimal
    - name: Download verified crate
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: verified-crate
        path: release
    - name: Compare package inputs without compiling
      run: |
        set -euo pipefail
        rustup run 1.93.0 cargo package -p codescythe --locked --no-verify
        version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/codescythe/Cargo.toml)
        python3 .github/scripts/verify-crate.py \
          "release/codescythe-$version.crate" "target/package/codescythe-$version.crate"
    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe
    - name: Publish crate
      run: |
        set -euo pipefail

        rustup run 1.93.0 cargo publish \
          -p codescythe \
          --registry crates-io \
          --locked \
          --no-verify
      env:
        CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"
permissions:
  actions: read
  contents: read
