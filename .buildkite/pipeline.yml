---
agents:
  queue: oss
steps:
- label: Test Rust
  key: native-oss-8-5-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh native
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 8.5.0
- label: Functional tests
  key: functional-oss-8-5-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh functional
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 8.5.0
  if: build.pull_request.id == null
- label: Validate BCR overlay (Linux AMD64)
  key: bcr-oss-8-5-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh bcr
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 8.5.0
- label: Validate BCR overlay (macOS ARM64)
  key: bcr-oss_darwin_arm64-8-5-0
  agents:
    queue: oss_darwin_arm64
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh bcr
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 8.5.0
- label: Verify hooks
  key: verify-hooks
  command:
  - python3 -B .buildkite/test-artifact.py
  - bash .buildkite/verify-hooks.sh
  agents:
    queue: oss
  timeout_in_minutes: 15
- label: Cross-build CLI (four targets) and verify crate
  key: release-build
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/release.sh build
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: "release/*"
  env:
    USE_BAZEL_VERSION: 8.5.0
    CARGO_HOME: /tmp/codescythe-ci/cargo
- label: Smoke CLI (Linux AMD64 artifacts)
  key: smoke-linux-amd64
  depends_on: release-build
  agents:
    queue: oss
  command: bash .buildkite/smoke.sh
  timeout_in_minutes: 15
- label: Smoke CLI (macOS ARM64 artifacts)
  key: smoke-darwin-arm64
  depends_on: release-build
  agents:
    queue: oss_darwin_arm64
  command: bash .buildkite/smoke.sh
  timeout_in_minutes: 15
- label: Smoke CLI (Windows AMD64 artifacts)
  key: smoke-windows-amd64
  depends_on: release-build
  agents:
    queue: oss_win_amd64
  command: powershell -NoProfile -ExecutionPolicy Bypass -File .buildkite/smoke-windows.ps1
  timeout_in_minutes: 15
- label: Upload release artifacts
  key: release-upload
  concurrency: 1
  concurrency_group: codescythe-release-upload
  depends_on:
  - release-build
  - smoke-linux-amd64
  - smoke-darwin-arm64
  - smoke-windows-amd64
  - native-oss-8-5-0
  - verify-hooks
  agents:
    queue: oss
  command: bash .buildkite/release.sh upload
  timeout_in_minutes: 15
  if: build.tag =~ /^codescythe_cli_v/ && build.pull_request.id == null
